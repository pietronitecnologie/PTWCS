[package]
name = "wcs_scada"
version = "0.1.0"
edition = "2024"
default-run = "wcs_scada"

[workspace]
members = [".", "client"]

[dependencies]
anyhow = "1.0.105"
argon2 = "0.5"
async-opcua = { version = "0.19", default-features = false, features = ["client"], optional = true }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bytes = { version = "1", optional = true }
chrono = "0.4.45"
futures = "0.3.34"
hex = "0.4"
password-hash = { version = "0.5", features = ["getrandom"] }
rand = "0.10.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rseip = { version = "0.3", optional = true }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp", "tcp-server"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []
opcua = ["dep:async-opcua"]
eip = ["dep:rseip", "dep:bytes"]
