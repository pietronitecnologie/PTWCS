# Impianto demo: linea di smistamento colli con scanner e deviatore.
# Avviare il simulatore PLC:  cargo run --bin plc_sim   (hub: cargo run --bin plc_hub)
# Avviare il WCS:             cargo run -- config/plant.yaml
plant:
  name: Magazzino Demo
  description: Linea smistamento colli – scanner SC1, deviatore DV1 a 3 uscite + scarto

server:
  bind: 0.0.0.0:8080
  database: wcs.db          # relativo a questa cartella
  web_root: ../web
  views_dir: views
  symbols_dir: symbols
  designer: true            # in produzione: false (o dietro autenticazione)
  retention_days: 30

scripting:
  python: python3
  module: ../scripts           # cartella: un file per funzione (nome.py → def nome(payload, ctx)), _modulo.py = codice condiviso

drivers:
  - name: PLC_LINEA
    protocol: modbus
    host: 127.0.0.1
    port: 5020
    unit_id: 1
    poll_ms: 100
    area: Linea

  # Hub di smistamento pacchi (demo grande): cargo run --release --bin plc_hub
  - name: PLC_HUB
    protocol: modbus
    host: 127.0.0.1
    port: 5021
    unit_id: 1
    poll_ms: 100

  # Esempi per gli altri protocolli (rimuovere il commento e adattare):
  # - name: PLC_S7
  #   protocol: s7
  #   host: 192.168.0.10
  #   rack: 0
  #   slot: 1                # S7-1200/1500: 1 · S7-300: 2
  #   poll_ms: 100
  # - name: PLC_OPCUA
  #   protocol: opcua        # richiede build con --features opcua
  #   endpoint: opc.tcp://192.168.0.20:4840
  # - name: PLC_AB
  #   protocol: eip          # richiede build con --features eip
  #   host: 192.168.0.30
  #   slot: 0

  - name: WCS_INTERNO        # variabili interne (setpoint, modalità, ...)
    protocol: sim
    poll_ms: 250
    area: Servizi

# Il progetto (aree, scan class, UDT, tag, punti di decisione/protocollo,
# classi di smistamento, WMS, allarmi) è in project.yaml ed è gestito dal Designer.
project_file: project.yaml
rules_dir: rules
