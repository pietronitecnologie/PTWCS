# Impianto demo: linea di smistamento colli con scanner e deviatore.
# Avviare il simulatore PLC:  cargo run --bin plc_sim
# Avviare il WCS:             cargo run -- config/plant.yaml
plant:
  name: Magazzino Demo
  description: Linea smistamento colli – scanner SC1, deviatore DV1 a 3 uscite + scarto

server:
  bind: 0.0.0.0:8080
  database: wcs.db          # relativo a questa cartella
  web_root: ../web
  views_dir: views
  symbols_dir: symbols
  designer: true            # in produzione: false (o dietro autenticazione)
  retention_days: 30

scripting:
  python: python3
  module: ../scripts/rules.py

drivers:
  - name: PLC_LINEA
    protocol: modbus
    host: 127.0.0.1
    port: 5020
    unit_id: 1
    poll_ms: 100

  # Esempi per gli altri protocolli (rimuovere il commento e adattare):
  # - name: PLC_S7
  #   protocol: s7
  #   host: 192.168.0.10
  #   rack: 0
  #   slot: 1                # S7-1200/1500: 1 · S7-300: 2
  #   poll_ms: 100
  # - name: PLC_OPCUA
  #   protocol: opcua        # richiede build con --features opcua
  #   endpoint: opc.tcp://192.168.0.20:4840
  # - name: PLC_AB
  #   protocol: eip          # richiede build con --features eip
  #   host: 192.168.0.30
  #   slot: 0

  - name: WCS_INTERNO        # variabili interne (setpoint, modalità, ...)
    protocol: sim
    poll_ms: 250

tags:
  # --- Nastri
  - { name: CV1.Run,   driver: PLC_LINEA, address: "coil:0", type: bool, writable: true, description: Nastro carico }
  - { name: CV2.Run,   driver: PLC_LINEA, address: "coil:1", type: bool, writable: true, description: Nastro scanner }
  - { name: CV3.Run,   driver: PLC_LINEA, address: "coil:2", type: bool, writable: true, description: Nastro smistamento }
  - { name: CV1.Fault, driver: PLC_LINEA, address: "di:0",   type: bool }
  - { name: CV2.Fault, driver: PLC_LINEA, address: "di:1",   type: bool }
  - { name: CV3.Fault, driver: PLC_LINEA, address: "di:2",   type: bool }
  - { name: Line.ResetFaults, driver: PLC_LINEA, address: "coil:30", type: bool, writable: true }
  - { name: Sim.InjectFault,  driver: PLC_LINEA, address: "coil:31", type: bool, writable: true }
  - { name: Line.EStop,       driver: PLC_LINEA, address: "di:4",    type: bool, description: Emergenza }
  - { name: CV1.Speed,   driver: PLC_LINEA, address: "ir:5", type: u16, unit: "m/min×10", historize: true }
  - { name: CV1.Current, driver: PLC_LINEA, address: "ir:6", type: u16, unit: "A×10", historize: true }
  - { name: CV1.Temp,    driver: PLC_LINEA, address: "ir:7", type: u16, unit: "°C×10", historize: true }

  # --- Telegramma scanner SC1 (area contigua hr0..hr14)
  - { name: SC1.ReqID,   driver: PLC_LINEA, address: "hr:0",  type: u16 }
  - { name: SC1.Weight,  driver: PLC_LINEA, address: "hr:1",  type: u16, unit: "g×10" }
  - { name: SC1.Barcode, driver: PLC_LINEA, address: "hr:2",  type: string, len: 20 }
  - { name: SC1.RespID,  driver: PLC_LINEA, address: "hr:12", type: u16, writable: true }
  - { name: SC1.Dest,    driver: PLC_LINEA, address: "hr:13", type: u16, writable: true }
  - { name: SC1.Result,  driver: PLC_LINEA, address: "hr:14", type: u16, writable: true }
  - { name: SC1.PhotoEye, driver: PLC_LINEA, address: "di:3", type: bool }

  # --- Deviatore e contatori
  - { name: DV1.Position, driver: PLC_LINEA, address: "hr:20", type: u16 }
  - { name: OUT1.Count,   driver: PLC_LINEA, address: "ir:0", type: u16, historize: true }
  - { name: OUT2.Count,   driver: PLC_LINEA, address: "ir:1", type: u16, historize: true }
  - { name: OUT3.Count,   driver: PLC_LINEA, address: "ir:2", type: u16, historize: true }
  - { name: REJECT.Count, driver: PLC_LINEA, address: "ir:3", type: u16, historize: true }
  - { name: SC1.Timeouts, driver: PLC_LINEA, address: "ir:4", type: u16 }

  # --- Variabili interne WCS
  - { name: WCS.MaxWeight, driver: WCS_INTERNO, address: max_weight, type: u16, writable: true, unit: "g×10", initial: 3000, description: Peso massimo accettato }
  - { name: WCS.Out3Enabled, driver: WCS_INTERNO, address: out3_enabled, type: bool, writable: true, initial: true, description: Uscita 3 abilitata }

decision_points:
  - name: SC1
    description: Scanner barcode – scelta uscita del collo
    request_tag: SC1.ReqID
    response_tag: SC1.RespID
    inputs:
      barcode: SC1.Barcode
      weight: SC1.Weight
    outputs:
      destination: SC1.Dest
      result: SC1.Result
    function: decide_sc1
    timeout_ms: 300
    fallback:              # usato se lo script fallisce o va in timeout
      destination: 99
      result: 9

alarms:
  - { id: CV1.FAULT, tag: CV1.Fault, message: "CV1 – guasto motore", severity: alarm }
  - { id: CV2.FAULT, tag: CV2.Fault, message: "CV2 – guasto motore", severity: alarm }
  - { id: CV3.FAULT, tag: CV3.Fault, message: "CV3 – guasto motore", severity: alarm }
  - { id: ESTOP,     tag: Line.EStop, message: "Emergenza premuta", severity: critical }
  - { id: CV1.TEMP,  tag: CV1.Temp, op: ">", value: 450, message: "CV1 – temperatura motore alta (>45 °C)", severity: warning }
  - { id: SC1.TMO,   tag: SC1.Timeouts, op: ">", value: 0, message: "SC1 – il PLC ha registrato timeout di risposta WCS", severity: info }
