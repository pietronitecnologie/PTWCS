# Tag gestiti dal Designer di WCS-SCADA: modificabili anche a mano (a WCS fermo).
- name: CV1.Run
  driver: PLC_LINEA
  address: coil:0
  type: bool
  writable: true
  description: Nastro carico
- name: CV2.Run
  driver: PLC_LINEA
  address: coil:1
  type: bool
  writable: true
  description: Nastro scanner
- name: CV3.Run
  driver: PLC_LINEA
  address: coil:2
  type: bool
  writable: true
  description: Nastro smistamento
- name: CV1.Fault
  driver: PLC_LINEA
  address: di:0
  type: bool
- name: CV2.Fault
  driver: PLC_LINEA
  address: di:1
  type: bool
- name: CV3.Fault
  driver: PLC_LINEA
  address: di:2
  type: bool
- name: Line.ResetFaults
  driver: PLC_LINEA
  address: coil:30
  type: bool
  writable: true
- name: Sim.InjectFault
  driver: PLC_LINEA
  address: coil:31
  type: bool
  writable: true
- name: Line.EStop
  driver: PLC_LINEA
  address: di:4
  type: bool
  description: Emergenza
- name: CV1.Speed
  driver: PLC_LINEA
  address: ir:5
  type: u16
  unit: m/min×10
  historize: true
- name: CV1.Current
  driver: PLC_LINEA
  address: ir:6
  type: u16
  unit: A×10
  historize: true
- name: CV1.Temp
  driver: PLC_LINEA
  address: ir:7
  type: u16
  unit: °C×10
  historize: true
