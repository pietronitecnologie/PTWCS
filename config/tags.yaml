- name: DV1.Position
  driver: PLC_LINEA
  address: hr:20
  type: u16
- name: OUT1.Count
  driver: PLC_LINEA
  address: ir:0
  type: u16
  historize: true
- name: OUT2.Count
  driver: PLC_LINEA
  address: ir:1
  type: u16
  historize: true
- name: OUT3.Count
  driver: PLC_LINEA
  address: ir:2
  type: u16
  historize: true
- name: REJECT.Count
  driver: PLC_LINEA
  address: ir:3
  type: u16
  historize: true
- name: SC1.Timeouts
  driver: PLC_LINEA
  address: ir:4
  type: u16
- name: WCS.MaxWeight
  driver: WCS_INTERNO
  address: max_weight
  type: u16
  writable: true
  description: Peso massimo accettato
  unit: g×10
  initial: 3000
- name: WCS.Out3Enabled
  driver: WCS_INTERNO
  address: out3_enabled
  type: bool
  writable: true
