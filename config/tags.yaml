  driver: PLC_LINEA
  address: hr:0
  type: u16
- name: SC1.Weight
  driver: PLC_LINEA
  address: hr:1
  type: u16
  unit: g×10
- name: SC1.Barcode
  driver: PLC_LINEA
  address: hr:2
  type: string
- name: SC1.RespID
  driver: PLC_LINEA
  address: hr:12
  type: u16
  writable: true
- name: SC1.Dest
  driver: PLC_LINEA
  address: hr:13
  type: u16
  writable: true
- name: SC1.Result
  driver: PLC_LINEA
  address: hr:14
  type: u16
  writable: true
- name: SC1.PhotoEye
  driver: PLC_LINEA
  address: di:3
