decision_points:
- name: SC1
  description: Scanner barcode – scelta uscita del collo
  telegram: SC1
  handshake: counter
  function: decide_sc1
  timeout_ms: 300
  fallback:
    destination: 99
    result: 9
- name: IN1
  description: 'Ingresso 1: assegnazione corsia/cella'
  telegram: IN1
  handshake: counter
  timeout_ms: 300
  fallback:
    destination: 0
    result: 4
  area: MP-Ingressi
- name: IN2
  description: 'Ingresso 2: assegnazione corsia/cella'
  telegram: IN2
  handshake: counter
  timeout_ms: 300
  fallback:
    destination: 0
    result: 4
  area: MP-Ingressi
- name: HSC0
  description: 'Hub: pre-smistamento Nord/Sud/scarti'
  telegram: HSC0
  handshake: counter
  function: hub_presort
  timeout_ms: 400
  fallback:
    destination: 99
    result: 9
  area: Hub-Collettore
- name: HSCN
  description: 'Hub: sorter Nord, scelta dello scivolo'
  telegram: HSCN
  handshake: counter
  function: hub_sort_nord
  timeout_ms: 400
  fallback:
    destination: 99
    result: 9
  area: Hub-SorterNord
- name: HSCS
  description: 'Hub: sorter Sud, scelta dello scivolo'
  telegram: HSCS
  handshake: counter
  function: hub_sort_sud
  timeout_ms: 400
  fallback:
    destination: 99
    result: 9
  area: Hub-SorterSud
sort_classes:
- name: NORD
  description: Nord Italia
  destination: '1'
  source: local
  patterns:
  - IT-MI*
  - IT-TO*
  - IT-BO*
- name: CENTROSUD
  description: Centro-Sud Italia
  destination: '2'
  source: local
  patterns:
  - IT-RM*
  - IT-NA*
  - IT-FI*
- name: ESTERO
  description: Spedizioni estere
  destination: '3'
  source: local
  patterns:
  - DE-*
  - FR-*
  - ES-*
- name: PRIORITARI
  description: Ordini prioritari (elenco barcode dal WMS)
  destination: '1'
  source: wms
wms:
  enabled: true
  base_url: http://127.0.0.1:8090/api
  destination_path: /parcels/{barcode}/destination
  destination_field: destination
  class_field: class
  classes_path: /sort-classes
  sync_interval_s: 30
  timeout_ms: 250
  cache_ttl_s: 300
alarms: []
timer_scripts:
- name: sim_magazzino
  function: sim_magazzino
  interval_ms: 200
  enabled: true
- name: sim_pallet
  function: sim_pallet
  interval_ms: 200
  enabled: true
- name: sim_reactor
  function: sim_reactor
  interval_ms: 500
  enabled: true
- name: proc_logic
  function: proc_logic
  interval_ms: 300
  enabled: true
warehouses:
- name: MP1
  description: Magazzino pallet 3 corsie – 3000 locazioni
  area: MagPallet
  aisles:
  - name: '1'
    crane: C1
    slots: 1
    pair_wait_s: 4.0
  - name: '2'
    crane: C2
    slots: 1
    pair_wait_s: 4.0
  - name: '3'
    crane: C3
    slots: 2
    pair_wait_s: 15.0
  sides: 2
  columns: 50
  levels: 10
  block_cols: 5
  inputs:
  - IN1
  - IN2
  outputs:
  - BU1
  - BU2
  col_time_s: 0.6
  lvl_time_s: 1.2
  lu_prefix: PAL
  initial_fill_pct: 62
  auto_outbound_s: 0
  auto_orders_s: 30
  demo_skus: 60
  level_max_height_mm:
  - 1800
  - 1800
  - 1500
  - 1500
  - 1500
  - 1500
  - 1500
  - 1500
  - 1500
  - 1500
  strategy:
    abc: true
    a_zone_pct: 0.2
    b_zone_pct: 0.3
    a_sku_pct: 0.2
    b_sku_pct: 0.3
    abc_window_h: 168
    spread_sku: true
  reorg:
    enabled: true
    idle_s: 20.0
    max_per_hour: 40
    min_gain_s: 2.0
security:
  enabled: true
  anonymous_role: visualizzatore
  session_minutes: 720
  idle_logout_minutes: 0
  roles:
  - name: amministratore
    description: Accesso completo, gestione utenti e sicurezza
    permissions:
    - '*'
  - name: progettista
