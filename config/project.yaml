# Progetto WCS-SCADA – gestito dal Designer (modificabile a mano a WCS fermo).
areas:
- name: Linea
  description: Linea di smistamento colli
- name: Carico
  description: Nastro di carico CV1
  parent: Linea
- name: Scanner
  description: Lettura barcode e pesatura
  parent: Linea
- name: Smistamento
  description: Deviatore DV1 e uscite
  parent: Linea
- name: Servizi
  description: Variabili interne WCS e simulazione
- name: Magazzino
  description: Magazzino automatico e movimentazione
- name: Processo
  description: Impianto di servizio (serbatoio acqua)
- name: MagPallet
  description: Magazzino automatico pallet MP1
- name: MP-Ingressi
  description: Ingressi IN1/IN2 e distribuzione
  parent: MagPallet
- name: MP-Trasli
  description: Trasloelevatori C1..C3
  parent: MagPallet
- name: MP-Uscite
  description: Raccolta e baie BU1/BU2
  parent: MagPallet
- name: Hub
  description: Hub di smistamento pacchi (demo grande con layer fisico)
- name: Hub-Ricevimento
  description: Baie di scarico e pre-smistamento
  parent: Hub
- name: Hub-Baia1
  description: Baia di scarico 1
  parent: Hub-Ricevimento
- name: Hub-Baia2
  description: Baia di scarico 2
  parent: Hub-Ricevimento
- name: Hub-Baia3
  description: Baia di scarico 3
  parent: Hub-Ricevimento
- name: Hub-Collettore
  description: Collettore, pre-smistatore SC0 e scarti
  parent: Hub-Ricevimento
- name: Hub-SorterNord
  description: Sorter Nord ad anello, 6 scivoli + scarti
  parent: Hub
- name: Hub-SorterSud
  description: Sorter Sud ad anello, 6 scivoli + scarti
  parent: Hub
scan_classes:
- name: veloce
  rate_ms: 100
  description: Handshake e segnali di processo
- name: normale
  rate_ms: 500
  description: Stati e contatori
- name: lenta
  rate_ms: 2000
  description: Analogici lenti e diagnostica
udt_types:
- name: Nastro
  description: Nastro trasportatore con marcia e guasto
  params:
  - name: Idx
    description: Indice del nastro nella mappa Modbus
  members:
  - name: Run
    type: bool
    address: coil:{Idx}
    writable: true
    description: Marcia (comando/stato)
  - name: Fault
    type: bool
    address: di:{Idx}
    description: Guasto motore
    alarms:
    - name: FAULT
      op: ==
      value: true
      message: '{Instance} – guasto motore'
      severity: alarm
- name: TelegrammaScanner
  description: 'Protocollo request/reply scanner: dati + ReqID (PLC), uscite + RespID (WCS)'
  params:
  - name: Base
    default: 0
    description: Primo holding register del telegramma
  members:
  - name: ReqID
    type: u16
    address: hr:{Base}
    description: Contatore richiesta (PLC)
    scan_class: veloce
    role: request
  - name: Weight
    type: u16
    address: hr:{Base+1}
    description: Peso collo
    unit: g×10
    role: input
  - name: Barcode
    type: string
    address: hr:{Base+2}
    description: Barcode letto
    role: input
  - name: RespID
    type: u16
    address: hr:{Base+12}
    writable: true
    description: Eco ReqID a risposta pronta (WCS)
    role: response
  - name: Destination
    type: u16
    address: hr:{Base+13}
    writable: true
    description: Uscita assegnata
    role: output
  - name: Result
    type: u16
    address: hr:{Base+14}
    writable: true
    description: 'Esito: 0 ok, 1 noread, 2 sovrappeso, 3 destinazione sconosciuta, 9 fallback'
    role: output
- name: Trasporto
  description: Nastro/rulliera motorizzata – layout S7 di 10 byte a partire da Base
  params:
  - name: DB
    default: 100
    description: Numero DB
  - name: Base
    default: 0
    description: Offset di partenza nel DB (byte)
  members:
