    type: bool
    address: DB{DB}.DBX{Base+0}.0
    description: In marcia
  - name: Fault
    type: bool
    address: DB{DB}.DBX{Base+0}.1
    description: Guasto
  - name: Auto
    type: bool
    address: DB{DB}.DBX{Base+0}.2
    description: Automatico
  - name: Occupied
    type: bool
    address: DB{DB}.DBX{Base+0}.3
    description: Occupato
  - name: Cmd_Start
    type: bool
    address: DB{DB}.DBX{Base+0}.4
    writable: true
    description: Comando marcia
  - name: Cmd_Stop
    type: bool
    address: DB{DB}.DBX{Base+0}.5
    writable: true
    description: Comando arresto
  - name: Cmd_Reset
    type: bool
    address: DB{DB}.DBX{Base+0}.6
    writable: true
    description: Reset guasto
  - name: Speed
    type: f32
    address: DB{DB}.DBD{Base+2}
    description: Velocità
    unit: m/min
    historize: true
  - name: Current
    type: f32
    address: DB{DB}.DBD{Base+6}
    description: Corrente motore
    unit: A
    historize: true
