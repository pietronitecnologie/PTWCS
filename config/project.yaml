    description: 'Origine: lato'
  - name: SrcCol
    type: u16
    address: DB{DB}.DBW{Base+10}
    writable: true
    description: 'Origine: colonna (0 = P&D)'
  - name: SrcLvl
    type: u16
    address: DB{DB}.DBW{Base+12}
    writable: true
    description: 'Origine: livello'
  - name: DstSide
    type: u16
    address: DB{DB}.DBW{Base+14}
    writable: true
    description: 'Destinazione: lato'
  - name: DstCol
    type: u16
    address: DB{DB}.DBW{Base+16}
    writable: true
    description: 'Destinazione: colonna (0 = P&D)'
  - name: DstLvl
    type: u16
    address: DB{DB}.DBW{Base+18}
    writable: true
    description: 'Destinazione: livello'
