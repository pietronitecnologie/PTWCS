- name: HubLinea
  description: 'Linea dell''hub: abilitazione dal WCS e stato dal PLC'
  params:
  - name: N
    default: 0
    description: Numero linea
  members:
  - name: Enable
    type: bool
    address: coil:{N+100}
    writable: true
    description: Abilitazione (avvio/arresto)
  - name: Running
    type: bool
    address: di:{N+100}
    description: In marcia senza guasti
- name: HubNastro
  description: 'Nastro dell''hub: marcia e guasto dal PLC, velocità reale (ingresso simulato)'
  params:
  - name: N
    default: 0
    description: Numero nastro
  members:
  - name: Run
    type: bool
    address: coil:{N+1000}
    description: Marcia (uscita PLC)
  - name: Fault
    type: bool
    address: di:{N+1000}
    description: Guasto motore
    alarms:
    - name: FAULT
      op: ==
      value: true
      message: '{Instance}: guasto motore (marcia senza velocità)'
      severity: alarm
  - name: Speed
    type: u16
    address: hr:{N+1000}
    writable: true
    description: Velocità reale (ingresso simulato)
    unit: m/s×100
- name: AssiTraslo
  description: 'Assi del trasloelevatore (layer fisico): quote obiettivo dal PLC, posizioni reali dalla fisica'
  params: []
  members:
  - name: TgtX
    type: f32
    address: ax_{Instance}_tgtx
    writable: true
    description: Quota obiettivo traslazione X (mm)
    unit: mm
  - name: TgtY
    type: f32
    address: ax_{Instance}_tgty
    writable: true
    description: Quota obiettivo sollevamento Y (mm)
    unit: mm
  - name: TgtZ
    type: f32
    address: ax_{Instance}_tgtz
    writable: true
    description: Quota obiettivo forche Z (mm, − lato 1, + lato 2)
    unit: mm
  - name: ActX
    type: f32
    address: ax_{Instance}_actx
    description: Posizione reale X
    unit: mm
  - name: ActY
    type: f32
    address: ax_{Instance}_acty
    description: Posizione reale Y
    unit: mm
  - name: ActZ
    type: f32
    address: ax_{Instance}_actz
    description: Posizione reale forche
    unit: mm
  - name: InPosX
    type: bool
    address: ax_{Instance}_inposx
    description: X in posizione
  - name: InPosY
    type: bool
    address: ax_{Instance}_inposy
    description: Y in posizione
  - name: InPosZ
    type: bool
    address: ax_{Instance}_inposz
    description: Forche in posizione
  - name: Load
    type: bool
    address: ax_{Instance}_load
    description: Carico sul carro (fotocellula)
  - name: Moving
    type: bool
    address: ax_{Instance}_moving
    description: Assi in movimento
  - name: Fault
    type: bool
    address: ax_{Instance}_fault
    description: Guasto rilevato (interblocco, azionamento)
    alarms:
    - name: FAULT
      op: ==
      value: true
      message: '{Instance}: guasto assi del traslo'
      severity: alarm
  - name: Reset
    type: bool
    address: ax_{Instance}_reset
    writable: true
    description: Reset guasti (fronte)
