devices:
- name: R1
  class: Reattore
  description: Reattore batch R1
  area: Processo
- name: R2
  class: Reattore
  description: Reattore batch R2
  area: Processo
sequences:
- name: Carico
  description: Carica il reattore fino al livello richiesto
  area: Processo
  device_class: Reattore
  unit: R1
  parameters:
  - name: Livello
    unit: '%'
    min: 10.0
    max: 95.0
    default: 60
    description: Livello di carico
  steps:
  - name: Apri carico
    actions:
    - kind: write
      tag: '{unit}.FillValve'
      value: true
    transitions:
    - when:
      - tag: '{unit}.Level'
        op: '>='
        value: '{Livello}'
      label: livello raggiunto
    timeout_s: 180.0
  - name: Chiudi carico
    actions:
    - kind: write
      tag: '{unit}.FillValve'
      value: false
  hold_actions:
  - kind: write
    tag: '{unit}.FillValve'
    value: false
  restart_actions:
  - kind: write
    tag: '{unit}.FillValve'
    value: true
  stop_actions:
  - kind: write
    tag: '{unit}.FillValve'
    value: false
- name: Riscaldo
  description: Porta il reattore in temperatura e la mantiene per il tempo richiesto
  area: Processo
  device_class: Reattore
  unit: R1
  parameters:
  - name: Temperatura
    unit: °C
    min: 25.0
    max: 90.0
    default: 60
  - name: Mantenimento
    unit: s
    min: 0.0
    max: 900.0
    default: 30
  steps:
  - name: Riscalda
    actions:
    - kind: write
      tag: '{unit}.SP_Temp'
      value: '{Temperatura}'
    - kind: write
      tag: '{unit}.Heater'
      value: true
    transitions:
    - when:
      - tag: '{unit}.Temp'
        op: '>='
        value: '{Temperatura}'
      label: temperatura raggiunta
    timeout_s: 600.0
  - name: Mantieni
    transitions:
    - when:
      - tag: '@elapsed'
        op: '>='
        value: '{Mantenimento}'
      label: tempo trascorso
  - name: Spegni
    actions:
    - kind: write
      tag: '{unit}.Heater'
      value: false
  hold_actions:
  - kind: write
    tag: '{unit}.Heater'
    value: false
  restart_actions:
  - kind: write
    tag: '{unit}.Heater'
    value: true
  stop_actions:
  - kind: write
    tag: '{unit}.Heater'
    value: false
- name: Agitazione
  description: Agita alla velocità richiesta per il tempo richiesto
  area: Processo
  device_class: Reattore
  unit: R1
  parameters:
  - name: Velocita
    unit: rpm
    min: 40.0
    max: 200.0
    default: 120
  - name: Tempo
    unit: s
    min: 5.0
    max: 1800.0
    default: 60
  steps:
  - name: Avvia agitatore
    actions:
    - kind: write
      tag: '{unit}.SP_AgitSpeed'
      value: '{Velocita}'
    - kind: write
      tag: '{unit}.Agitator'
      value: true
    transitions:
    - when:
      - tag: '@elapsed'
        op: '>='
        value: '{Tempo}'
  - name: Ferma agitatore
    actions:
    - kind: write
      tag: '{unit}.Agitator'
      value: false
  hold_actions:
  - kind: write
    tag: '{unit}.Agitator'
    value: false
  restart_actions:
  - kind: write
    tag: '{unit}.Agitator'
    value: true
  stop_actions:
  - kind: write
    tag: '{unit}.Agitator'
    value: false
- name: Scarico
  description: Svuota il reattore
  area: Processo
  device_class: Reattore
  unit: R1
  steps:
  - name: Apri scarico
    actions:
    - kind: write
      tag: '{unit}.DrainValve'
      value: true
    transitions:
    - when:
      - tag: '{unit}.Level'
        op: <=
        value: 1
      label: reattore vuoto
    timeout_s: 180.0
  - name: Chiudi scarico
    actions:
    - kind: write
      tag: '{unit}.DrainValve'
      value: false
  hold_actions:
  - kind: write
    tag: '{unit}.DrainValve'
    value: false
  restart_actions:
  - kind: write
    tag: '{unit}.DrainValve'
    value: true
  stop_actions:
  - kind: write
    tag: '{unit}.DrainValve'
    value: false
