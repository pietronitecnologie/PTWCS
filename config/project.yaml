- name: TelegrammaIngresso
  description: 'Ingresso pallet: identificazione e controllo sagoma/peso, richiesta di stoccaggio al WCS'
  params:
  - name: DB
    default: 310
  - name: Base
    default: 0
  members:
  - name: Occupied
    type: bool
    address: DB{DB}.DBX{Base+0}.0
    description: Pallet presente
  - name: ReqID
    type: u16
    address: DB{DB}.DBW{Base+2}
    description: Contatore richiesta (PLC)
    role: request
  - name: Barcode
    type: string
    address: DB{DB}.DBB{Base+4}
    description: Identificativo pallet
    role: input
  - name: Weight
    type: f32
    address: DB{DB}.DBD{Base+26}
    description: Peso
    unit: kg
    role: input
  - name: Height
    type: u16
    address: DB{DB}.DBW{Base+30}
    description: Altezza
    unit: mm
    role: input
  - name: RespID
    type: u16
    address: DB{DB}.DBW{Base+32}
    writable: true
    description: Eco ReqID (WCS)
    role: response
  - name: Destination
    type: u16
    address: DB{DB}.DBW{Base+34}
    writable: true
    description: Corsia assegnata (0 = respinto)
    role: output
  - name: Result
    type: u16
    address: DB{DB}.DBW{Base+36}
    writable: true
    description: 'Esito: 0 ok, 1 noread, 2 peso, 3 sagoma, 4 non stoccabile'
    role: output
  - name: Rejected
    type: u32
    address: DB{DB}.DBD{Base+38}
    description: Pallet respinti
  - name: Sku
    type: string
    address: DB{DB}.DBB{Base+42}
    description: Articolo (anagrafica UdC)
    role: input
  - name: Qty
    type: u16
    address: DB{DB}.DBW{Base+64}
    description: Quantità a bordo
    role: input
- name: BaiaUscita
  description: Baia d'uscita pallet
  params:
  - name: DB
    default: 320
  - name: Base
    default: 0
  members:
