decision_points:
- name: SC1
  description: Scanner barcode – scelta uscita del collo
  telegram: SC1
  handshake: counter
  function: decide_sc1
  timeout_ms: 300
  fallback:
    destination: 99
    result: 9
- name: IN1
  description: 'Ingresso 1: assegnazione corsia/cella'
  telegram: IN1
  handshake: counter
  timeout_ms: 300
  fallback:
    destination: 0
    result: 4
  area: MP-Ingressi
- name: IN2
  description: 'Ingresso 2: assegnazione corsia/cella'
  telegram: IN2
  handshake: counter
  timeout_ms: 300
  fallback:
    destination: 0
    result: 4
  area: MP-Ingressi
sort_classes:
- name: NORD
  description: Nord Italia
  destination: '1'
  source: local
  patterns:
  - IT-MI*
  - IT-TO*
  - IT-BO*
- name: CENTROSUD
  description: Centro-Sud Italia
  destination: '2'
  source: local
  patterns:
  - IT-RM*
  - IT-NA*
  - IT-FI*
- name: ESTERO
  description: Spedizioni estere
  destination: '3'
  source: local
  patterns:
  - DE-*
  - FR-*
  - ES-*
- name: PRIORITARI
  description: Ordini prioritari (elenco barcode dal WMS)
  destination: '1'
  source: wms
wms:
  enabled: true
  base_url: http://127.0.0.1:8090/api
  destination_path: /parcels/{barcode}/destination
  destination_field: destination
  class_field: class
  classes_path: /sort-classes
  sync_interval_s: 30
  timeout_ms: 250
  cache_ttl_s: 300
alarms: []
timer_scripts:
- name: sim_magazzino
  function: sim_magazzino
  interval_ms: 200
  enabled: true
- name: sim_pallet
  function: sim_pallet
  interval_ms: 200
  enabled: true
- name: sim_reactor
  function: sim_reactor
  interval_ms: 500
  enabled: true
warehouses:
- name: MP1
  description: Magazzino pallet 3 corsie – 3000 locazioni
  area: MagPallet
  aisles:
  - name: '1'
    crane: C1
    slots: 1
    pair_wait_s: 4.0
  - name: '2'
    crane: C2
    slots: 1
    pair_wait_s: 4.0
  - name: '3'
    crane: C3
    slots: 2
    pair_wait_s: 15.0
  sides: 2
  columns: 50
  levels: 10
  block_cols: 5
  inputs:
  - IN1
  - IN2
  outputs:
  - BU1
  - BU2
  col_time_s: 0.6
  lvl_time_s: 1.2
  lu_prefix: PAL
  initial_fill_pct: 62
  auto_outbound_s: 0
  auto_orders_s: 30
  demo_skus: 60
  level_max_height_mm:
  - 1800
  - 1800
  - 1500
  - 1500
  - 1500
  - 1500
  - 1500
  - 1500
  - 1500
  - 1500
  strategy:
    abc: true
    a_zone_pct: 0.2
    b_zone_pct: 0.3
    a_sku_pct: 0.2
    b_sku_pct: 0.3
    abc_window_h: 168
    spread_sku: true
  reorg:
    enabled: true
    idle_s: 20.0
    max_per_hour: 40
    min_gain_s: 2.0
security:
  enabled: true
  anonymous_role: visualizzatore
  session_minutes: 720
  idle_logout_minutes: 0
  roles:
  - name: amministratore
    description: Accesso completo, gestione utenti e sicurezza
    permissions:
    - '*'
  - name: progettista
    description: Designer completo (viste, progetto, regole, script)
    permissions:
    - runtime.view
    - tag.write
    - alarm.ack
    - script.call
    - wh.operate
    - wh.config
    - designer
    - designer.views
    - designer.project
    - rules.edit
    - scripts.edit
    - seq.operate
    - batch.operate
    - recipe.edit
    - audit.view
  - name: manutentore
    description: Runtime completo e WCS, Designer in sola lettura
    permissions:
    - runtime.view
    - tag.write
    - alarm.ack
    - script.call
    - wh.operate
    - wh.config
    - designer
    - seq.operate
    - batch.operate
    - recipe.edit
    - audit.view
  - name: operatore
    description: 'Conduzione impianto: comandi, allarmi, missioni'
    permissions:
    - runtime.view
    - tag.write
    - alarm.ack
    - script.call
    - wh.operate
    - seq.operate
    - batch.operate
  - name: visualizzatore
    description: Sola visualizzazione
    permissions:
    - runtime.view
devices:
- name: R1
  class: Reattore
  description: Reattore batch R1
  area: Processo
- name: R2
  class: Reattore
  description: Reattore batch R2
  area: Processo
sequences:
- name: Carico
  description: Carica il reattore fino al livello richiesto
  area: Processo
  device_class: Reattore
  unit: R1
  parameters:
  - name: Livello
    unit: '%'
    min: 10.0
    max: 95.0
    default: 60
    description: Livello di carico
  steps:
  - name: Apri carico
    actions:
    - kind: write
      tag: '{unit}.FillValve'
      value: true
    transitions:
    - when:
      - tag: '{unit}.Level'
        op: '>='
        value: '{Livello}'
      label: livello raggiunto
    timeout_s: 180.0
  - name: Chiudi carico
    actions:
    - kind: write
      tag: '{unit}.FillValve'
      value: false
  hold_actions:
  - kind: write
    tag: '{unit}.FillValve'
    value: false
  restart_actions:
  - kind: write
    tag: '{unit}.FillValve'
    value: true
  stop_actions:
  - kind: write
    tag: '{unit}.FillValve'
    value: false
- name: Riscaldo
  description: Porta il reattore in temperatura e la mantiene per il tempo richiesto
  area: Processo
  device_class: Reattore
  unit: R1
  parameters:
  - name: Temperatura
    unit: °C
    min: 25.0
    max: 90.0
    default: 60
  - name: Mantenimento
    unit: s
    min: 0.0
    max: 900.0
    default: 30
  steps:
  - name: Riscalda
    actions:
    - kind: write
      tag: '{unit}.SP_Temp'
      value: '{Temperatura}'
    - kind: write
      tag: '{unit}.Heater'
      value: true
    transitions:
    - when:
      - tag: '{unit}.Temp'
        op: '>='
        value: '{Temperatura}'
      label: temperatura raggiunta
    timeout_s: 600.0
  - name: Mantieni
    transitions:
    - when:
      - tag: '@elapsed'
        op: '>='
        value: '{Mantenimento}'
      label: tempo trascorso
  - name: Spegni
    actions:
    - kind: write
      tag: '{unit}.Heater'
      value: false
  hold_actions:
  - kind: write
    tag: '{unit}.Heater'
    value: false
  restart_actions:
  - kind: write
    tag: '{unit}.Heater'
    value: true
  stop_actions:
  - kind: write
    tag: '{unit}.Heater'
    value: false
- name: Agitazione
  description: Agita alla velocità richiesta per il tempo richiesto
  area: Processo
  device_class: Reattore
  unit: R1
  parameters:
  - name: Velocita
    unit: rpm
    min: 40.0
    max: 200.0
    default: 120
  - name: Tempo
    unit: s
    min: 5.0
    max: 1800.0
    default: 60
  steps:
  - name: Avvia agitatore
    actions:
    - kind: write
      tag: '{unit}.SP_AgitSpeed'
      value: '{Velocita}'
    - kind: write
      tag: '{unit}.Agitator'
      value: true
    transitions:
    - when:
      - tag: '@elapsed'
        op: '>='
        value: '{Tempo}'
  - name: Ferma agitatore
    actions:
    - kind: write
      tag: '{unit}.Agitator'
      value: false
  hold_actions:
  - kind: write
    tag: '{unit}.Agitator'
    value: false
  restart_actions:
  - kind: write
    tag: '{unit}.Agitator'
    value: true
  stop_actions:
  - kind: write
    tag: '{unit}.Agitator'
    value: false
- name: Scarico
  description: Svuota il reattore
  area: Processo
  device_class: Reattore
  unit: R1
  steps:
  - name: Apri scarico
    actions:
    - kind: write
      tag: '{unit}.DrainValve'
      value: true
    transitions:
    - when:
      - tag: '{unit}.Level'
        op: <=
        value: 1
      label: reattore vuoto
    timeout_s: 180.0
  - name: Chiudi scarico
    actions:
    - kind: write
      tag: '{unit}.DrainValve'
      value: false
  hold_actions:
  - kind: write
    tag: '{unit}.DrainValve'
    value: false
  restart_actions:
  - kind: write
    tag: '{unit}.DrainValve'
    value: true
  stop_actions:
  - kind: write
    tag: '{unit}.DrainValve'
    value: false
